model:
  model_name: "distilbert-base-uncased"  # Switch to "roberta-base", "microsoft/deberta-v3-large", or "roberta-large" as needed
  num_labels: 3
  max_length: 128
  dropout: 0.1

dataset:
  data_dir: "dataset"
  raw_dir: "dataset/raw"
  processed_dir: "dataset/processed"
  merged_dir: "dataset/merged"
  reports_dir: "dataset/reports"
  cache_dir: "dataset/cache"
  sample_size_per_class: 5000  # Subsample size for each of the 3 classes to keep runs fast. Set to 0 to use all available data.
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  random_seed: 42
  min_text_length: 5           # Minimum character length for valid text
  conflict_resolution: "majority_vote" # Strategy: majority_vote or severity_priority
  near_duplicate_threshold: 0.90 # Jaccard similarity threshold for near duplicate detection

preprocessing:
  lowercase: true
  remove_urls: true
  remove_mentions: true
  remove_html: true
  normalize_emojis: true
  normalize_repeated_chars: true
  normalize_unicode: true
  remove_duplicates: true
  language_filter: "en"
  handle_hashtags: true
  remove_emails: true
  normalize_whitespace: true
  normalize_punctuation: true
  remove_invisible_chars: true
  normalize_quotes: true
  handle_reddit_formatting: true
  handle_markdown_formatting: true
  remove_corrupted_unicode: true

training:
  output_dir: "saved_models"
  logging_dir: "logs"
  learning_rate: 2e-5
  batch_size: 16
  epochs: 3
  weight_decay: 0.01
  gradient_accumulation_steps: 2
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  early_stopping_patience: 2
  fp16: false  # Auto-enabled in PyTorch script if GPU is available
  evaluation_strategy: "epoch"
  save_strategy: "epoch"
  metric_for_best_model: "macro_f1"

api:
  host: "127.0.0.1"
  port: 8000

voice:
  speech_rate: 150
  volume: 1.0
